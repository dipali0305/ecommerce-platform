spring.application.name=auth-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ThisIsADefaultDevSecretKeyThatShouldBeAtLeast256BitsLongForHS256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:300000}
app.refresh-token.expiration-ms=600000

app.admin.email=${ADMIN_EMAIL:admin@system.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:System admin}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Server
server.port=${SERVER_PORT:8080}
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Logging
logging.level.com.ecommerce.auth=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
app.password-reset.expiration-ms=300000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true